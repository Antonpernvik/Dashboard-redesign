<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logga in – Ai Kollegorna</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=IBM+Plex+Serif:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
html{font-size:100%}
body{margin:0;background:#FFFFFF}
.aik{
  --bg:#FFFFFF;--subtle:#F8F8F9;--hover:#F3F3F4;--border:#E6E6E8;--border-strong:#8E8E96;
  --fg:#0B0B0D;--fg-2:#3F3F46;--fg-3:#63636B;--accent:#1326D2;--accent-bg:#EEF2FA;--cta:#3E1FF3;--cta-h:#3417D9;--red:#C4261D;--red-ink:#A41F17;--red-bg:#FBEDEC;
  --sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;--display:'IBM Plex Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss03';font-variant-numeric:tabular-nums;
}
.aik *,.aik *::before,.aik *::after{box-sizing:border-box}
.aik h1,.aik p{margin:0}
.aik a{color:inherit}
.aik button,.aik input{font-family:inherit;font-size:inherit;color:inherit;font-variant-numeric:tabular-nums}
.aik ::selection{background:var(--accent-bg)}
.aik :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.aik img{display:block}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18vh 16px 64px}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:24px}
.card .brand{align-self:center;font-size:15px;font-weight:590;line-height:20px;color:var(--fg)}
.card h1{text-align:center;font-family:var(--display);font-weight:500;font-size:26px;line-height:32px;letter-spacing:-.4px}
.card .sub{display:block;margin-top:8px;text-align:center;font-size:14px;color:var(--fg-2)}
.card form{display:flex;flex-direction:column;gap:16px}
.card label{display:flex;flex-direction:column;gap:6px}
.card label > span,.card .lh label{font-size:13px;font-weight:510}
.card .lh{display:flex;justify-content:space-between;align-items:center}
.field{width:100%;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.field:hover{border-color:var(--fg-3)}
.field:focus{border-color:var(--fg-2);box-shadow:0 0 0 3px var(--accent-bg)}
.field::placeholder{color:var(--fg-3)}
.field.err{border-color:var(--red)}
.pw{position:relative;display:block}
.pw .field{padding-right:64px}
.pw .btn{position:absolute;right:4px;top:4px;height:32px;padding:0 8px;border:0;border-radius:4px;background:transparent;color:var(--fg-2)}
.pw .btn:hover{background:var(--hover)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-weight:510;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.btn-primary{height:40px;margin-top:4px;border-color:var(--cta);border-radius:999px;background:var(--cta);color:#fff;font-size:14px}
.btn.btn-primary:hover{background:var(--cta-h);border-color:var(--cta-h)}
.btn-text{height:32px;padding:0 6px;margin:-6px -6px;border:0;border-radius:6px;background:transparent;color:var(--fg-2);font-size:13px;font-weight:400;text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.btn-text:hover{background:var(--hover);color:var(--fg)}
.btn-text.quiet{color:var(--fg-3)}
.alert{padding:10px 14px;border-radius:8px;background:var(--red-bg);color:var(--red-ink);font-size:13px;line-height:18px}
.card .foot{text-align:center;font-size:13px;color:var(--fg-3)}
.card .foot a{display:inline-block;padding:6px 0;color:var(--fg);font-weight:510;text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:3px}
.card .center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card .center .ic{width:40px;height:40px;border-radius:999px;background:var(--subtle);display:flex;align-items:center;justify-content:center;color:var(--fg-2)}
.card .center img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.card .center p{font-size:14px;line-height:20px;color:var(--fg-2)}
.card .center b{color:var(--fg);font-weight:510}
.card .center .btn{margin-top:8px}
@media (max-width:640px){.login{padding-top:12vh}}

/* större innehåll (sidomenyn oförändrad) */
@media (min-width:901px){.aik .main{zoom:1.15}}
@media (max-width:900px){.aik .main{zoom:1.06}}
</style>
</head><body><div id="app"></div><template id="dc-tpl">

<div class="aik">
<main class="login">
<section aria-label="Logga in" class="card">
<span class="brand">Ai Kollegorna</span>
<sc-if value="{{modeLogin}}" hint-placeholder-val="{{true}}">
<div><h1>Logga in</h1><span class="sub">Granska och godkänn det Erik har förberett.</span></div>
<form onSubmit="{{submit}}">
<label><span>E-post</span><input type="email" autocomplete="username" value="{{email}}" onChange="{{setEmail}}" placeholder="namn@bolag.se" class="field {{emailCls}}"></label>
<div style="display: flex; flex-direction: column; gap: 6px"><span class="lh"><label for="pw">Lösenord</label><button type="button" onClick="{{goForgot}}" class="btn btn-text btn-sm">Glömt lösenordet?</button></span>
<span class="pw"><input id="pw" type="{{pwType}}" autocomplete="current-password" value="{{pw}}" onChange="{{setPw}}" class="field {{pwCls}}"><button type="button" onClick="{{togglePw}}" aria-label="{{pwToggleLabel}}" class="btn">{{pwToggleText}}</button></span></div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}"><span role="alert" class="alert">{{errText}}</span></sc-if>
<button type="submit" class="btn btn-primary">Logga in</button>
</form>
<span class="foot">Inget konto än? <a href="https://aikollegorna.se">Skapa konto</a></span>
</sc-if>

<sc-if value="{{modeForgot}}" hint-placeholder-val="{{false}}">
<div><h1>Återställ lösenord</h1><span class="sub">Vi mejlar en länk där du väljer ett nytt.</span></div>
<form onSubmit="{{sendReset}}">
<label><span>E-post</span><input type="email" autocomplete="email" value="{{email}}" onChange="{{setEmail}}" placeholder="namn@bolag.se" class="field {{emailCls}}"></label>
<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}"><span role="alert" class="alert">{{errText}}</span></sc-if>
<button type="submit" class="btn btn-primary">Skicka återställningslänk</button>
</form>
<button onClick="{{goLogin}}" class="btn btn-text btn-sm quiet" style="align-self: flex-start">← Tillbaka till inloggning</button>
</sc-if>

<sc-if value="{{modeSent}}" hint-placeholder-val="{{false}}">
<div class="center">
<span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
<h1>Kolla din inkorg</h1>
<p>Finns det ett konto för <b>{{email}}</b> har vi skickat en länk för att välja nytt lösenord. Länken gäller i 30 minuter.</p>
<button onClick="{{goLogin}}" class="btn">Tillbaka till inloggning</button>
</div>
</sc-if>

<sc-if value="{{modeIn}}" hint-placeholder-val="{{false}}">
<div class="center">
<img src="../assets/erik.jpg" alt="">
<h1>Du är inloggad</h1>
<p>Erik har 2 förslag som väntar på dig.</p>
<a href="Main.html" class="btn btn-primary">Till dashboarden</a>
</div>
</sc-if>
</section>
</main>
</div>

</template><script src="dc-runtime.js"></script><script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'login', email: '', pw: '', showPw: false, err: '' };
  }
  renderVals() {
    const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(this.state.email.trim());
    const mode = this.state.mode;
    const err = this.state.err;
    return {
      email: this.state.email, pw: this.state.pw,
      setEmail: (e) => this.setState({ email: e.target.value, err: '' }),
      setPw: (e) => this.setState({ pw: e.target.value, err: '' }),
      pwType: this.state.showPw ? 'text' : 'password',
      pwToggleText: this.state.showPw ? 'Dölj' : 'Visa', pwToggleLabel: this.state.showPw ? 'Dölj lösenord' : 'Visa lösenord',
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!validEmail) { this.setState({ err: 'email' }); return; }
        if (!this.state.pw) { this.setState({ err: 'pw' }); return; }
        this.setState({ mode: 'in', err: '' });
      },
      sendReset: (e) => { if (e && e.preventDefault) e.preventDefault(); if (!validEmail) { this.setState({ err: 'email' }); return; } this.setState({ mode: 'sent', err: '' }); },
      goForgot: () => this.setState({ mode: 'forgot', err: '' }),
      goLogin: () => this.setState({ mode: 'login', err: '' }),
      modeLogin: mode === 'login', modeForgot: mode === 'forgot', modeSent: mode === 'sent', modeIn: mode === 'in',
      hasError: !!err, errText: err === 'email' ? 'Skriv en giltig e-postadress.' : 'Skriv ditt lösenord.',
      emailCls: err === 'email' ? 'err' : '', pwCls: err === 'pw' ? 'err' : ''
    };
  }
}

DC.mount(Component, {});</script></body></html>
