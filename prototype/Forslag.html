<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erik – Förslag</title>
<link rel="stylesheet" href="../handoff/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
html,body{transition:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-tpl">
<div style="--base: {{t.base}}; --glass: {{t.glass}}; --glassLine: {{t.glassLine}}; --glassHi: {{t.glassHi}}; --soft: {{t.soft}}; --line: {{t.line}}; --ink: {{t.ink}}; --muted: {{t.muted}}; --pill: {{t.pill}}; --pillInk: {{t.pillInk}}; --green: {{t.green}}; --onGreen: {{t.onGreen}}; --chart: {{t.chart}}; --chartPrev: {{t.chartPrev}}; --tintG: {{t.tintG}}; --down: {{t.down}}; --shadow: {{t.shadow}}; position: relative; overflow: clip; min-height: 100vh; box-sizing: border-box; background: var(--base); color: var(--ink); font-family: 'Geist', system-ui, sans-serif">

<!-- Blurred backdrop -->
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden">
<div style="position: absolute; left: -8%; top: -6%; width: 46%; height: 520px; border-radius: 999px; background: {{t.blob1}}; filter: blur(90px)"></div>
<div style="position: absolute; right: -6%; top: 4%; width: 42%; height: 600px; border-radius: 999px; background: {{t.blob2}}; filter: blur(110px)"></div>
<div style="position: absolute; left: 28%; top: 38%; width: 40%; height: 520px; border-radius: 999px; background: {{t.blob3}}; filter: blur(110px)"></div>
<div style="position: absolute; left: -4%; bottom: -4%; width: 38%; height: 560px; border-radius: 999px; background: {{t.blob4}}; filter: blur(100px)"></div>
<div style="position: absolute; right: 4%; bottom: 6%; width: 34%; height: 460px; border-radius: 999px; background: {{t.blob1}}; filter: blur(100px)"></div>
</div>

<div style="position: relative; box-sizing: border-box; padding: 16px; display: flex; gap: 16px; align-items: flex-start">

<!-- Focus scrim: blurs the dashboard while the menu is open -->
<div aria-hidden="true" style="position: fixed; inset: 0; z-index: 20; pointer-events: none; background: {{t.scrim}}; backdrop-filter: blur(8px) saturate(120%); -webkit-backdrop-filter: blur(8px) saturate(120%); opacity: {{lo}}; transition: opacity .3s cubic-bezier(.65,0,.35,1)"></div>

<!-- Sidebar -->
<div style="position: sticky; top: 16px; z-index: 30; flex: none; width: 76px; height: calc(100vh - 32px); min-height: 620px">
<aside onMouseEnter="{{openRail}}" onMouseLeave="{{closeRail}}" onFocus="{{openRail}}" onBlur="{{closeRail}}" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{railW}}; box-sizing: border-box; overflow: hidden; padding: 14px; border-radius: 28px; background: var(--glass); border: 1px solid var(--glassLine); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); box-shadow: {{railShadow}}; display: flex; flex-direction: column; gap: 14px; transition: width .28s cubic-bezier(.65,0,.35,1), box-shadow .28s">

<button aria-label="Byt kollega, nu vald: Erik" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 48px; padding: 0; border-radius: 16px; border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left; white-space: nowrap">
<img src="../assets/erik.jpg" alt="" style="width: 48px; height: 48px; flex: none; border-radius: 16px; object-fit: cover; box-shadow: 0 0 0 2px var(--green), 0 8px 20px {{t.greenGlow}}">
<span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2; opacity: {{lo}}; transition: opacity .2s"><span style="font-size: 15px; font-weight: 600">Erik</span><span style="font-size: 12px; color: var(--muted)">B2B-säljare</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-right: 6px; opacity: {{lo}}; transition: opacity .2s"><path d="m6 9 6 6 6-6"></path></svg>
</button>

<div style="height: 1px; background: var(--line); margin: 2px 6px"></div>

<nav aria-label="Erik" style="display: flex; flex-direction: column; gap: 6px">
<a href="Main.dc.html" aria-label="Start" style="text-decoration: none; position: relative; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s; color: var(--ink)">Start</span></a>
<a href="Forslag.dc.html" aria-current="page" aria-label="Förslag, 11 nya" style="text-decoration: none; position: relative; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; background: var(--glassHi); color: var(--green); font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--glassLine)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"></path></svg><span style="flex: 1; opacity: {{lo}}; transition: opacity .2s; color: var(--ink)">Förslag</span><span style="position: absolute; left: 30px; top: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--green); color: var(--onGreen); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--base)">11</span></a>
<a href="Foretag.dc.html" aria-label="Identifierade företag, 11 nya" style="text-decoration: none; position: relative; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path><path d="M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"></path></svg><span style="flex: 1; opacity: {{lo}}; transition: opacity .2s">Identifierade företag</span><span style="position: absolute; left: 30px; top: 6px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--green); color: var(--onGreen); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--base)">11</span></a>
<a href="Pagaende.dc.html" aria-label="Pågående sälj" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M17 2l4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s">Pågående sälj</span></a>
<a href="Korningar.dc.html" aria-label="Körningar" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M13 2 3 14h9l-1 8 10-12h-9z"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s">Körningar</span></a>
</nav>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<span style="height: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0 14px; white-space: nowrap; opacity: {{lo}}; transition: opacity .2s">Inställningar</span>
<nav aria-label="Inställningar" style="display: flex; flex-direction: column; gap: 6px">
<a href="Kundprofiler.dc.html" aria-label="Kundprofiler" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><circle cx="12" cy="12" r="3"></circle></svg><span style="opacity: {{lo}}; transition: opacity .2s">Kundprofiler</span></a>
<a href="Arbetsfloden.dc.html" aria-label="Arbetsflöden" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="3" width="6" height="6" rx="1.5"></rect><rect x="15" y="15" width="6" height="6" rx="1.5"></rect><path d="M9 6h4a3 3 0 0 1 3 3v6"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s">Arbetsflöden</span></a>
<a href="Integrationer.dc.html" aria-label="Integrationer" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M19.4 7.3a2.4 2.4 0 0 0 0 3.4l1.6 1.6c.5.5.5 1.2 0 1.7l-1.6 1.6a2.4 2.4 0 0 1-3.4 0 2.4 2.4 0 0 0-3.4 3.4l1.6 1.6c.5.5.5 1.2 0 1.7l-.3.2M4.6 16.7a2.4 2.4 0 0 0 0-3.4L3 11.7c-.5-.5-.5-1.2 0-1.7l1.6-1.6a2.4 2.4 0 0 1 3.4 0 2.4 2.4 0 0 0 3.4-3.4L9.8 3.4c-.5-.5-.5-1.2 0-1.7"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s">Integrationer</span></a>
<a href="Installningar.dc.html" aria-label="Inställningar" style="text-decoration: none; display: flex; align-items: center; gap: 14px; height: 48px; padding: 0 14px; border-radius: 16px; color: var(--ink); font-size: 14px; font-weight: 500; white-space: nowrap">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg><span style="opacity: {{lo}}; transition: opacity .2s">Inställningar</span></a>
</nav>
<div style="height: 1px; background: var(--line); margin: 6px 6px"></div>
<div style="display: flex; align-items: center; gap: 12px; white-space: nowrap">
<div style="width: 48px; height: 48px; flex: none; border-radius: 999px; background: var(--pill); color: var(--pillInk); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">KB</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; line-height: 1.25; opacity: {{lo}}; transition: opacity .2s">
<span style="font-size: 13px; font-weight: 600">[Kundens bolag]</span>
<span style="font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis">namn@kund.se</span>
<a href="Login.dc.html" style="font-size: 12px; font-weight: 600; color: var(--green)">Logga ut</a>
</div>
</div>
</div>
</aside>
</div>

<!-- Main -->
<main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<header style="position: relative; z-index: 15; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 10px 10px 22px; border-radius: 24px; background: var(--glass); border: 1px solid var(--glassLine); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); box-shadow: var(--shadow)">
<div style="display: flex; flex-direction: column; line-height: 1.2; padding: 4px 0">
<span style="font-size: 19px; font-weight: 600; letter-spacing: -0.01em">{{todayStr}} <span style="font-size: 13px; font-weight: 500; color: var(--muted)">{{weekStr}}</span></span>
<span style="font-size: 12px; color: var(--muted)">Erik · B2B-säljare</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 4px; border-radius: 999px; background: var(--tintG); color: var(--ink); font-size: 13px; font-weight: 600"><span style="position: relative; width: 36px; height: 36px; flex: none"><img src="../assets/erik.jpg" alt="" style="width: 36px; height: 36px; border-radius: 999px; object-fit: cover"><span style="position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 999px; background: var(--green); border: 2px solid var(--base)"></span></span>Erik är aktiv</span>

<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--soft); border: 1px solid var(--glassLine); color: var(--muted); font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" placeholder="Sök bolag eller kontakt" aria-label="Sök" style="border: 0; background: transparent; outline: none; font: inherit; color: var(--ink); width: 170px">
</label>
<button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--glassLine); background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{light}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></sc-if>
</button>
<sc-if value="{{anyPop}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" onMouseDown="{{closePops}}" style="position: fixed; inset: 0; z-index: 40; background: transparent; cursor: default"></div></sc-if>
<div style="position: relative">
<button onClick="{{toggleNotif}}" aria-label="{{notifLabel}}" aria-expanded="{{notifStr}}" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--glassLine); background: var(--soft); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>
<sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 999px; background: var(--green); color: var(--onGreen); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{unreadN}}</span></sc-if>
</button>
<sc-if value="{{notifOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-label="Notiser" style="position: absolute; right: 0; top: 54px; width: 380px; max-width: calc(100vw - 120px); padding: 14px; border-radius: 22px; background: {{t.pop}}; border: 1px solid var(--glassLine); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 30px 80px rgba(0,0,0,0.22); display: flex; flex-direction: column; gap: 6px; z-index: 50">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 8px"><span style="font-size: 15px; font-weight: 600">Notiser</span><button onClick="{{markAllRead}}" style="border: 0; background: transparent; padding: 6px; color: var(--green); font-size: 12px; font-weight: 600; cursor: pointer">Markera alla som lästa</button></div>
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" onClick="{{n.read}}" style="text-decoration: none; color: var(--ink); display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 14px; background: {{n.bg}}">
<span style="width: 8px; height: 8px; margin-top: 6px; flex: none; border-radius: 999px; background: {{n.dot}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: {{n.weight}}; line-height: 1.4">{{n.text}}</span><span style="font-size: 11px; color: var(--muted)">{{n.kind}} · {{n.when}}</span></span>
</a>
</sc-for>
<a href="#" style="text-align: center; padding: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none">Notisinställningar</a>
</div>
</sc-if>
</div>
<div style="position: relative">
<button onClick="{{toggleTask}}" aria-expanded="{{taskStr}}" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--green); color: var(--onGreen); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 20px {{t.greenGlow}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ge Erik ett uppdrag</button>
<sc-if value="{{taskOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-label="Ge Erik ett uppdrag" style="position: absolute; right: 0; top: 56px; width: 440px; max-width: calc(100vw - 120px); border-radius: 24px; background: {{t.pop}}; border: 1px solid var(--glassLine); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%); box-shadow: 0 30px 80px rgba(0,0,0,0.22); overflow: hidden; z-index: 50">
<sc-if value="{{taskForm}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px">
<img src="../assets/erik.jpg" alt="" style="width: 44px; height: 44px; border-radius: 14px; object-fit: cover; box-shadow: 0 0 0 2px var(--green)">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">Vad vill du att jag gör?</span><span style="font-size: 12px; color: var(--muted)">Skriv fritt eller välj ett förslag nedan</span></div>
<button onClick="{{closePops}}" aria-label="Stäng" style="width: 36px; height: 36px; flex: none; border-radius: 999px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="padding: 0 18px; display: flex; flex-direction: column; gap: 12px">
<textarea aria-label="Uppdrag" value="{{taskText}}" onChange="{{setTaskText}}" placeholder="T.ex. hitta 20 bolag som liknar Allente i Göteborg" style="min-height: 96px; resize: vertical; padding: 14px; border-radius: 16px; border: 1.5px solid {{t.fieldLine}}; background: {{t.field}}; color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5; outline: none; box-sizing: border-box; width: 100%"></textarea>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)">Förslag</span>
<sc-for list="{{taskIdeas}}" as="ti" hint-placeholder-count="4">
<button onClick="{{ti.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 14px; border: 0; background: transparent; color: var(--ink); font-size: 13px; text-align: left; cursor: pointer">
<span style="width: 30px; height: 30px; flex: none; border-radius: 10px; background: var(--tintG); color: var(--green); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>{{ti.label}}</button>
</sc-for>
</div>
</div>

<script>
class Component extends DCLogic {
  aikReadTheme(fallback) {
    try { window.localStorage.removeItem('aik-theme'); } catch (e) {}
    try { const v = window.sessionStorage.getItem('aik-theme-tab'); if (v === 'dark') return true; if (v === 'light') return false; } catch (e) {}
    if (typeof window.__aikTheme === 'boolean') return window.__aikTheme;
    return !!fallback;
  }
  aikWriteTheme(dark) {
    window.__aikTheme = dark;
    try { window.sessionStorage.setItem('aik-theme-tab', dark ? 'dark' : 'light'); } catch (e) {}
  }
  aikPaintRoot(doc, dark) {
    try {
      const root = doc.documentElement;
      root.style.background = dark ? '#0A0F0C' : '#D8D2C6';
      root.style.colorScheme = dark ? 'dark' : 'light';
      if (doc.body) doc.body.style.background = dark ? '#0A0F0C' : '#D8D2C6';
    } catch (e) {}
  }

  constructor(props) {
    super(props);
    this.state = { dark: this.aikReadTheme(props.startDark), tab: 'Översikt', period: '30 d', channel: 'Alla kanaler', kpi: 'Svar', compare: true, auto: true, rail: false, openP: null, decided: {}, ratings: {}, kind: 'Alla', seq: false };
  }
  componentDidMount() {
    this.aikPaintRoot(document, this.state.dark);
  }
  componentDidUpdate(prevProps, prevState) {
    if (prevState.dark !== this.state.dark) this.aikPaintRoot(document, this.state.dark);
  }
  renderVals() {
    const accent = this.props.accent ?? '#1E7B4E';

      base: '#0A0F0C', blob1: '#1D3A2B', blob2: '#3A3124', blob3: '#173226', blob4: '#2B2A22',
      glass: 'rgba(22,30,25,0.55)', glassHi: 'rgba(34,46,38,0.7)', glassLine: 'rgba(255,255,255,0.08)',
      soft: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.08)', ink: '#EEF2EE', muted: '#A3AFA7',
      pill: '#EEF2EE', pillInk: '#0A0F0C', green: accent, onGreen: '#FFFFFF', greenGlow: 'rgba(30,123,78,0.35)',
      chart: '#4CC285', chartPrev: '#6C7A71', tintG: 'rgba(76,194,133,0.2)', down: '#F07A63',
      shadow: '0 10px 40px rgba(0,0,0,0.35)',
      scrim: 'rgba(10,15,12,0.35)', pop: 'rgba(22,30,25,0.97)', field: 'rgba(255,255,255,0.05)', fieldLine: 'rgba(255,255,255,0.12)', prioBg: 'rgba(245,158,11,0.2)', prioFg: '#FBC27A', inv: 'rgba(24,52,38,0.78)', invInk: '#EEF2EE', invSoft: 'rgba(255,255,255,0.06)', invLine: 'rgba(255,255,255,0.1)', invGreen: '#6EDC9F', invGlow: 'rgba(110,220,159,0.22)'
    } : {
      base: '#D8D2C6', blob1: '#B9C4A8', blob2: '#EADFCB', blob3: '#9FB394', blob4: '#CDB89C',
      glass: 'rgba(255,255,255,0.42)', glassHi: 'rgba(255,255,255,0.68)', glassLine: 'rgba(255,255,255,0.65)',
      soft: 'rgba(255,255,255,0.45)', line: 'rgba(30,40,34,0.1)', ink: '#14201A', muted: '#4B5750',
      pill: '#14201A', pillInk: '#FFFFFF', green: accent, onGreen: '#FFFFFF', greenGlow: 'rgba(30,123,78,0.28)',
      chart: '#1E7B4E', chartPrev: '#8A938C', tintG: 'rgba(30,123,78,0.16)', down: '#B3382A',
      shadow: '0 10px 40px rgba(60,50,30,0.10)',
      scrim: 'rgba(216,210,198,0.28)', pop: 'rgba(251,250,247,0.97)', field: '#FFFFFF', fieldLine: 'rgba(20,32,26,0.12)', prioBg: '#FCE3C6', prioFg: '#8A3A0C', inv: 'rgba(17,28,22,0.86)', invInk: '#F1F5F2', invSoft: 'rgba(255,255,255,0.08)', invLine: 'rgba(255,255,255,0.12)', invGreen: '#6EDC9F', invGlow: 'rgba(110,220,159,0.22)'
    };
    const up = dark ? '#4CC285' : '#17643F';

    const toggleTheme = (e) => {
      if (this._themeBusy) return;
      const el = e && e.currentTarget;
      const next = !this.state.dark;
      const doc = (el && el.ownerDocument) || document;
      const win = doc.defaultView || window;
      this.aikWriteTheme(next);
      let reduce = false;
      try { reduce = !!(win.matchMedia && win.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (err) {}
      if (!el || typeof doc.startViewTransition !== 'function' || reduce) { this.setState({ dark: next }); return; }

      const x = Math.round(r.left + r.width / 2), y = Math.round(r.top + r.height / 2);

      try {
        vt = doc.startViewTransition(() => new Promise((res) => {
          this.setState({ dark: next }, () => { this.aikPaintRoot(doc, next); res(); });
        }));
      } catch (err) {
        this._themeBusy = false; this.setState({ dark: next }); return;
      }

        doc.documentElement.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + end + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 620, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'both', pseudoElement: '::view-transition-new(root)' }
